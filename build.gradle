buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'com.zeasn.ozyplay.env'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main {
            java.srcDirs = ['app/src/main/java']
            manifest.srcFile 'app/src/main/AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.gms:play-services-ads-identifier:18.1.0"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.Ozyplay-Support'
                artifactId = 'ozyplay-env-android'
                version = '1.0.0'

                pom {
                    name = 'OzyplayEnv Android SDK'
                    description = 'Android SDK providing JS Bridge for WebView apps — device info, lifecycle events, screen state, Google Ad ID, and geo info.'
                    url = 'https://github.com/Ozyplay-Support/ozyplay-env-android'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'Ozyplay-Support'
                            name = 'Ozyplay-Support'
                        }
                    }

                    scm {
                        connection = 'scm:git:github.com/Ozyplay-Support/ozyplay-env-android.git'
                        url = 'https://github.com/Ozyplay-Support/ozyplay-env-android'
                    }
                }
            }
        }
    }
}
